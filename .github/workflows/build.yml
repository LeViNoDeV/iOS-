name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned app
        run: |
          xcodebuild -project LifeSim.xcodeproj -target LifeSim \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/LifeSim.app Payload/
          zip -qry LifeSim.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LifeSim-ipa
          path: LifeSim.ipa
